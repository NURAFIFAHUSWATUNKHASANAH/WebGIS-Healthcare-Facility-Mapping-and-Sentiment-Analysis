<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} — HEALTHGIS Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap"
          rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

    <!-- CSS Khusus Halaman -->
    {% block css %}
    {% endblock %}

</head>
<body>

<div class="wrapper">

    {% include 'admin/partials/sidebar.html' %}

    <div class="main-content">

        {% include 'admin/partials/navbar.html' %}

        <div class="content-wrapper">

            {% block content %}
            {% endblock %}

        </div>

        {% include 'admin/partials/footer.html' %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="{{ url_for('static', filename='js/sweetAlert.js') }}"></script>

<script src="{{ url_for('static', filename='js/sweetAlert_Delete.js') }}"></script>

<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script>
      document.addEventListener("DOMContentLoaded", function () {
    const toggleSidebarBtn = document.getElementById("toggleSidebar");
    const closeSidebarBtn = document.getElementById("closeSidebar");
    const sidebar = document.querySelector(".sidebar");
    const mainContent = document.querySelector(".main-content");

    // Fungsi untuk membuka / menutup sidebar (Toggle)
    if (toggleSidebarBtn && sidebar) {
        toggleSidebarBtn.addEventListener("click", function () {
            sidebar.classList.toggle("collapsed");
            if (mainContent) {
                mainContent.classList.toggle("expanded");
            }
        });
    }

    // Fungsi tombol close (X) khusus tampilan mobile/responsive
    if (closeSidebarBtn && sidebar) {
        closeSidebarBtn.addEventListener("click", function () {
            sidebar.classList.remove("collapsed");
            sidebar.classList.remove("active"); // Sesuai dengan css mobile Anda jika ada
        });
    }
});
</script>

{% block js %}
{% endblock %}

</body>
</html>
