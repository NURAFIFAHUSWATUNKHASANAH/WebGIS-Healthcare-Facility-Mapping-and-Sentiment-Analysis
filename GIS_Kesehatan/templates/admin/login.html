<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin — HEALTHGIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="login-wrapper position-relative overflow-hidden d-flex align-items-center justify-content-center">
    <div class="glow-bg-1"></div>
    <div class="glow-bg-2"></div>

    <div class="login-container position-relative z-1 px-3">
        <div class="login-card">
            <div class="card-glow"></div>
            
            <div class="text-center mb-4">
                <a href="{{ url_for('home') }}" class="brand-logo text-decoration-none mb-2 d-inline-flex align-items-center">
                    <span class="brand-dot"></span>HEALTH<span class="text-gradient">GIS</span>
                </a>
                <p class="text-muted-custom small text-uppercase letter-spacing-1">
                    Secure Admin Portal Dashboard
                </p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label-custom mb-2">Username</label>
                    <div class="input-group-custom">
                        <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
                        <input 
                            type="email" 
                            name="email"
                            class="form-control-custom" 
                            placeholder="Masukan Username Anda" 
                            required>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label-custom m-0">Kata Sandi</label>
                        
                    </div>
                    <div class="input-group-custom">
                        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                        <input 
                            type="password" 
                            name="password"
                            class="form-control-custom" 
                            placeholder="••••••••" 
                            required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient w-100 rounded-pill mb-3">
                    Otentikasi Masuk <i class="fa-solid fa-right-to-bracket ms-2"></i>
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('home') }}" class="back-link d-inline-flex align-items-center gap-2">
                    <i class="fa-solid fa-arrow-left small-icon"></i> Kembali ke Landing Page
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
